# Copiá este archivo a config.yaml y ajustalo.
search:
  # Cada combinación keyword x location se busca por separado.
  keywords:
    - "Desarrollador Full Stack"
    - "PHP Developer"
    - "Frontend Developer"
  locations:
    - "Argentina"
  # Filtros de LinkedIn (dejar vacío para no filtrar)
  posted_within_days: 7        # 1, 7 o 30
  remote: true                 # solo remoto / híbrido
  experience_levels: [2, 3]    # 1=Prácticas 2=Junior 3=Semi-senior 4=Senior 5=Director
  max_results_per_query: 25
  exclude_title_words: ["Senior Staff", "Principal", "Lead"]
  exclude_companies: []

matching:
  min_fit_score: 60            # 0-100; por debajo no se adapta el CV
  max_tailored_per_run: 10

cv:
  # "auto" = mismo idioma que la oferta. También "es" o "en".
  language: auto
  generate_cover_letter: true

llm:
  model: claude-opus-5-5
