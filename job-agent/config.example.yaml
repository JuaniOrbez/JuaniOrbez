# Copiá este archivo a config.yaml y ajustalo.
search:
  # Cada combinación keyword x location se busca por separado.
  keywords:
    - "Desarrollador Full Stack"
    - "PHP Developer"
    - "Frontend Developer"
  locations:
    - "Argentina"
  # Filtros de LinkedIn (dejar vacío para no filtrar)
  posted_within_days: 7        # 1, 7 o 30
  remote: true                 # solo remoto / híbrido
  experience_levels: [2, 3]    # 1=Prácticas 2=Junior 3=Semi-senior 4=Senior 5=Director
  max_results_per_query: 25
  exclude_title_words: ["Senior Staff", "Principal", "Lead"]
  exclude_companies: []

matching:
  min_fit_score: 60            # 0-100; por debajo no se adapta el CV
  max_tailored_per_run: 10

cv:
  # "auto" = mismo idioma que la oferta. También "es" o "en".
  language: auto
  generate_cover_letter: true

llm:
  model: claude-opus-5-5

# ---- Lo usa el agente de Claude Code (/postular) ----
canva:
  carpeta: "CVs"               # carpeta de Canva donde están tus CVs
  cv_base: "CV Base"           # nombre del diseño que se usa como modelo
  # Nombre de cada copia adaptada. Variables: {empresa} {puesto} {fecha}
  nombre_copia: "CV - {empresa} - {puesto} - {fecha}"

postulacion:
  carpeta_local_cvs: "cvs"     # adónde se bajan los PDF (relativo a job-agent/)
  # false = el agente completa todo y te pide confirmación antes de "Enviar".
  # true  = envía solo si TODAS las respuestas salieron de tu CV o de perfil/respuestas.yaml.
  envio_automatico: false
  max_postulaciones_por_dia: 15
